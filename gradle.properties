# Your source. Change these three after copying the template.

# The name shown in Saikou Neo's Settings > Sources.
source.name=Starter source
# A unique id in lowercase words with dots, such as io.github.yourname.mysource.
# Saikou Neo replaces a source when you add a new version with the same id.
source.id=com.example.source
# The version, as three numbers. Raise it before each release.
source.version=1.0.0

# You can leave these as they are.

# The class with your code. Change it only if you rename or move StarterSource.kt.
source.class=com.example.source.StarterSource
# The Saikou Neo extension API version to build against.
source.apiVersion=1

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# The app already has the Kotlin standard library, so the APK doesn't carry its own.
kotlin.stdlib.default.dependency=false
