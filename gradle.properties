org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# The app already has the Kotlin standard library, so the APK doesn't carry its own.
kotlin.stdlib.default.dependency=false

# Your source. Change these after copying the template.
# The package name. Saikou Neo keeps one source per id, so a new version with the same id replaces the old one.
source.id=com.example.source
# The name shown in Settings > Sources.
source.name=Starter source
# The class that implements SourceExtension. It needs a constructor with no arguments.
source.class=com.example.source.StarterSource
# Raise both for every release. The release tag is v<versionName>, such as v1.0.0.
source.versionCode=1
source.versionName=1.0.0
# The extension API version you build against. It's also the version of the API on Maven Central.
source.apiVersion=1
