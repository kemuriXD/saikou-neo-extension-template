name: Release

# Pushing a tag named v<source.versionName>, such as v1.0.0, builds a signed APK
# and attaches it to a GitHub release as source.apk. Its link is what you add in
# Saikou Neo. The signing key and passwords are repository secrets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep '^source.versionName=' gradle.properties | cut -d= -f2-)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match source.versionName $version in gradle.properties."
            exit 1
          fi

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. The README says how to add them."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :source:testDebugUnitTest :source:assembleRelease

      # Only a signed build is named source-release.apk, so an unsigned one stops here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp source/build/outputs/apk/release/source-release.apk "$RUNNER_TEMP/source.apk"
          gh release create "$TAG" "$RUNNER_TEMP/source.apk" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          rm -f "$RUNNER_TEMP/release.jks"
