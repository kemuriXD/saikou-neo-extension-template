name: Release

# Run this from the Actions tab to release the version in gradle.properties. It
# builds a signed APK and puts it on a new GitHub release with a source.json list
# that points to it. The list's link, or the v.gd code in the release notes, is
# what you add in Saikou Neo. The signing key and its password are repository
# secrets.
#
# To keep your code private, release into a public repo instead. Set the
# variables RELEASES_OWNER and RELEASES_REPO to that repo, and RELEASES_CLIENT_ID and
# the secret RELEASES_APP_KEY to a GitHub App installed on it with Contents: read
# and write. Its sources.json then lists every source released into it.
on:
  workflow_dispatch:

permissions:
  contents: write

# Releases into a shared repo all edit its sources.json, so they wait for each other.
concurrency:
  group: release-${{ vars.RELEASES_REPO || github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the source
        id: source
        run: |
          setting() { grep "^source.$1=" gradle.properties | cut -d= -f2-; }
          {
            echo "name=$(setting name)"
            echo "id=$(setting id)"
            echo "version=$(setting version)"
            echo "api=$(setting apiVersion)"
          } >> "$GITHUB_OUTPUT"

      - name: Get a token for the public repo
        id: app
        if: vars.RELEASES_REPO != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASES_CLIENT_ID }}
          private-key: ${{ secrets.RELEASES_APP_KEY }}
          owner: ${{ vars.RELEASES_OWNER }}
          repositories: ${{ vars.RELEASES_REPO }}

      # A source's own repo has one source, so its tag is the version and the links say "latest".
      # A shared repo has many, so each is named by a short hash of the source's id. That keeps
      # the source's name out of the public repo's tags and file names. The logo, if there is an
      # icon.png, is named the same way.
      - name: Work out where it goes
        id: target
        env:
          ID: ${{ steps.source.outputs.id }}
          VERSION: ${{ steps.source.outputs.version }}
          SHARED: ${{ vars.RELEASES_OWNER }}/${{ vars.RELEASES_REPO }}
        run: |
          if [ -n "${{ vars.RELEASES_REPO }}" ]; then
            key="$(printf '%s' "$ID" | sha256sum | cut -c1-12)"
            tag="$key-v$VERSION"
            name="$key"
            base="https://github.com/$SHARED/releases/download/$tag"
            {
              echo "repo=$SHARED"
              echo "tag=$tag"
              echo "list=sources.json"
              echo "list_url=https://raw.githubusercontent.com/$SHARED/HEAD/sources.json"
            } >> "$GITHUB_OUTPUT"
          else
            name="source"
            base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
            {
              echo "repo=$GITHUB_REPOSITORY"
              echo "tag=v$VERSION"
              echo "list=source.json"
              echo "list_url=https://github.com/$GITHUB_REPOSITORY/releases/latest/download/source.json"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "apk=$name.apk" >> "$GITHUB_OUTPUT"
          echo "apk_url=$base/$name.apk" >> "$GITHUB_OUTPUT"
          if [ -f icon.png ]; then
            echo "icon=$name.png" >> "$GITHUB_OUTPUT"
            echo "icon_url=$base/$name.png" >> "$GITHUB_OUTPUT"
          fi

      - name: Check this version isn't released yet
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::$TAG is already released. Raise source.version in gradle.properties first."
            exit 1
          fi

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. The README says how to add them."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # KEY_ALIAS and KEY_PASSWORD are only needed for a key made differently from the README's.
      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :source:testDebugUnitTest :source:assembleRelease

      # One entry in the list format Saikou Neo reads, with the logo's link when there is one. A
      # shared list keeps everyone else's entries.
      - name: Write the list
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ steps.target.outputs.repo }}
          ID: ${{ steps.source.outputs.id }}
          NAME: ${{ steps.source.outputs.name }}
          VERSION: ${{ steps.source.outputs.version }}
          API: ${{ steps.source.outputs.api }}
          APK_URL: ${{ steps.target.outputs.apk_url }}
          ICON_URL: ${{ steps.target.outputs.icon_url }}
          LIST: ${{ steps.target.outputs.list }}
        run: |
          list='{"sources":[]}'
          if [ -n "${{ vars.RELEASES_REPO }}" ] && gh api "repos/$REPO/contents/sources.json" > "$RUNNER_TEMP/current.json" 2>/dev/null; then
            list="$(jq -r .content "$RUNNER_TEMP/current.json" | base64 --decode)"
          fi
          echo "$list" | jq --arg id "$ID" --arg name "$NAME" --arg version "$VERSION" --argjson api "$API" --arg apk "$APK_URL" --arg icon "$ICON_URL" \
            '.sources = ([.sources[] | select(.id != $id)] + [{id: $id, name: $name, version: $version, api: $api, apk: $apk} + (if $icon == "" then {} else {icon: $icon} end)] | sort_by(.name))' \
            > "$RUNNER_TEMP/$LIST"
          cat "$RUNNER_TEMP/$LIST"

      # A lowercase code is easy to type on a TV, and it stays the same for every release, since
      # the list's link doesn't change. Set the SHORT_CODE variable to pick your own.
      - name: Get a v.gd code for the list
        id: code
        env:
          LIST_URL: ${{ steps.target.outputs.list_url }}
          WANTED: ${{ vars.SHORT_CODE }}
        run: |
          code="$(echo "${WANTED:-s$(printf '%s' "$LIST_URL" | sha256sum | cut -c1-7)}" | tr '[:upper:]' '[:lower:]')"
          vgd() { curl -sS --max-time 15 --get "https://v.gd/$1.php" --data format=json "${@:2}" || true; }
          taken="$(vgd forward --data-urlencode "shorturl=$code" | jq -r '.url // empty' 2>/dev/null || true)"
          if [ "$taken" = "$LIST_URL" ]; then
            short="$code"
          elif [ -z "$taken" ]; then
            answer="$(vgd create --data-urlencode "url=$LIST_URL" --data-urlencode "shorturl=$code")"
            short="$(echo "$answer" | jq -r '.shorturl // empty' 2>/dev/null || true)"
            short="${short##*/}"
            reason="$(echo "$answer" | jq -r '.errormessage // empty' 2>/dev/null || true)"
          else
            reason="the code $code already leads somewhere else. Set SHORT_CODE to another one"
          fi
          if [ -n "$short" ]; then
            echo "line=Add it in Saikou Neo with the code **$short**, or the link $LIST_URL" >> "$GITHUB_OUTPUT"
          else
            echo "line=Add it in Saikou Neo with the link $LIST_URL (v.gd didn't give a code: ${reason:-no answer})" >> "$GITHUB_OUTPUT"
          fi

      # Only a signed build is named source-release.apk, so an unsigned one stops here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          TAG: ${{ steps.target.outputs.tag }}
          APK: ${{ steps.target.outputs.apk }}
          ICON: ${{ steps.target.outputs.icon }}
          LIST: ${{ steps.target.outputs.list }}
          CODE_LINE: ${{ steps.code.outputs.line }}
        run: |
          cp source/build/outputs/apk/release/source-release.apk "$RUNNER_TEMP/$APK"
          rm -f "$RUNNER_TEMP/release.jks"
          files=("$RUNNER_TEMP/$APK")
          if [ -n "$ICON" ]; then
            cp icon.png "$RUNNER_TEMP/$ICON"
            files+=("$RUNNER_TEMP/$ICON")
          fi
          if [ -n "${{ vars.RELEASES_REPO }}" ]; then
            # The list goes first, so in an empty repo the app makes the first commit and the release has one to tag.
            # Everything here is done by the app, so its bot is the only author shown.
            content="$(base64 --wrap=0 "$RUNNER_TEMP/$LIST")"
            args=(--method PUT "repos/$REPO/contents/sources.json" -f message="Update sources.json" -f content="$content")
            if [ -f "$RUNNER_TEMP/current.json" ]; then args+=(-f sha="$(jq -r .sha "$RUNNER_TEMP/current.json")"); fi
            gh api "${args[@]}" > /dev/null
            gh release create "$TAG" "${files[@]}" --repo "$REPO" --title "$TAG" --notes "$CODE_LINE" --latest=false
          else
            gh release create "$TAG" "${files[@]}" "$RUNNER_TEMP/$LIST" --repo "$REPO" \
              --target "$GITHUB_SHA" --title "$TAG" --notes "$CODE_LINE" --generate-notes
          fi
          echo "$CODE_LINE" >> "$GITHUB_STEP_SUMMARY"
