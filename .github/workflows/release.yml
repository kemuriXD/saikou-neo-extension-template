name: Release

# Run this from the Actions tab to release the version in gradle.properties. It
# builds a signed APK and attaches it to a new GitHub release as source.apk. Its
# link is what you add in Saikou Neo. The signing key and its password are
# repository secrets.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check this version isn't released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep '^source.version=' gradle.properties | cut -d= -f2-)"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Version $version is already released. Raise source.version in gradle.properties first."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The signing secrets are missing. The README says how to add them."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # KEY_ALIAS and KEY_PASSWORD are only needed for a key made differently from the README's.
      - name: Test and build
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :source:testDebugUnitTest :source:assembleRelease

      # Only a signed build is named source-release.apk, so an unsigned one stops here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp source/build/outputs/apk/release/source-release.apk "$RUNNER_TEMP/source.apk"
          gh release create "$TAG" "$RUNNER_TEMP/source.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          rm -f "$RUNNER_TEMP/release.jks"
